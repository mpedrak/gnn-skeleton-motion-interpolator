description: "similar to v_34, but trained on 4 datasets with different steps and skip start values"

# Model parameters
context_len_pre: 10
context_len_post: 10
target_len: 10
rot_gnn_params: {
  num_features_in: 6,
  num_features_out: 6,
  hidden_dim: 320,
  num_layers: 4,
  dropout: 0.01,
  num_heads: 8
}
root_pos_mlp_params: {
  num_features_in: 3,
  num_features_out: 3,
  hidden_dim: 256,
  num_layers: 7,
  dropout: 0.05,
  num_features_in_from_gnn: 64
}

# Training parameters
train_batch_size: 512
epochs: 200
validation_split: 0.2
patience: 7
early_stop_eps: 0.00001
loss_weights: {
  rot_geo_l1: 1.0,
  root_pos_l2: 0.1,
  fk_pos_l1: 0.1
}
lr_scheduler_params: {
  start_lr: 0.001,
  min_lr: 0.0001,
  factor: 0.75,
  patience: 3
}
train_data_params: [
  {step: 8, skip_start: 100, dir: "data/train/lafan1-S1-S2-S3-S4"},
  {step: 1, skip_start: 1, dir: "data/train/ACCAD-F1-M1-M2"},
  {step: 1, skip_start: 30, dir: "data/train/PFNN-LF"},
  {step: 1, skip_start: 1, dir: "data/train/SFU"}
]

# Test and benchmark parameters   
test_batch_size: 1024                               
test_data_params: [
  {step: 35, skip_start: 100, dir: "data/test/lafan1-S5"},
  {step: 4, skip_start: 1, dir: "data/test/ACCAD-F1A-M1A-M2D"},
  {step: 4, skip_start: 30, dir: "data/test/PFNN-LF-2-9-11"},
  {step: 1, skip_start: 1, dir: "data/test/SFU-5"}
]
