# Model parameters
context_len_pre: 10
context_len_post: 10
target_len: 10
hidden_dim: 96
hidden_layers: 7
heads: 16
root_pos_hidden_dim: 192
dropout: 0.02
node_features: 6                                  
graph_features: 3                                 

# Dataset parameters
step: 7                                          
batch_size: 1000

# Training parameters
epochs: 500
start_lr: 0.001
min_lr: 0.000001
lr_factor: 0.5
lr_patience: 3
validation_split: 0.3
patience: 7
root_loss_weight: 0.1
fk_loss_weight: 0.07
foot_joint_names: ["LeftToe", "RightToe"]
foot_height_eps: 2.0
foot_velocity_eps: 0.5
foot_skate_loss_weight: 0.01
smoothness_loss_weight: 0.015
epoch_loss_switch: 50
train_data_dir: "data/train"

# Testing parameters
test_data_dir: "data/test"