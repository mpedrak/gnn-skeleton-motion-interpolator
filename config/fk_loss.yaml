# Model parameters
context_len_pre: 10
context_len_post: 10
target_len: 10
hidden_dim: 72
hidden_layers: 7
heads: 16
root_pos_hidden_dim: 172
dropout: 0.1
node_features: 6                                  
graph_features: 3                                 
model_path: "checkpoints/fk_loss.pth"
root_stats_path: "checkpoints/root_stats/fk_loss.npz"

# Dataset parameters
step: 7                                          
batch_size: 1427

# Training parameters
epochs: 500
lr: 0.0001
validation_split: 0.3
patience: 7
root_loss_weight: 0.1
fk_loss_weight: 0.07
train_data_dir: "data/train"
train_log_path: "results/fk_loss_train.txt"

# Testing parameters
test_data_dir: "data/test"
test_log_path: "results/fk_loss_test.txt"